worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format structured escape=json
        '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    access_log /dev/stdout structured;
    error_log /dev/stderr warn;

    upstream agentmesh_api {
        zone agentmesh_api 64k;
        server api:8080 resolve;
        keepalive 32;
    }

    upstream agentmesh_dashboard {
        zone agentmesh_dashboard 64k;
        server dashboard:3000 resolve;
        keepalive 16;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_request_id $agentmesh_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    server {
        listen 8080;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /run/secrets/tls.crt;
        ssl_certificate_key /run/secrets/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location = /healthz {
            proxy_pass http://agentmesh_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $agentmesh_request_id;
        }

        location = /readyz {
            proxy_pass http://agentmesh_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $agentmesh_request_id;
        }

        location /api/v1/ {
            proxy_pass http://agentmesh_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $agentmesh_request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }

        location / {
            auth_basic "AgentMesh operations";
            auth_basic_user_file /run/secrets/dashboard.htpasswd;
            proxy_pass http://agentmesh_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $agentmesh_request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
