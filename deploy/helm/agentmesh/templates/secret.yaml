{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentmesh.secretName" . }}
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.databaseURLKey }}: {{ required "secrets.databaseURL is required when secrets.existingSecret is empty" .Values.secrets.databaseURL | quote }}
  {{ .Values.secrets.natsURLKey }}: {{ required "secrets.natsURL is required when secrets.existingSecret is empty" .Values.secrets.natsURL | quote }}
  {{ .Values.secrets.redisURLKey }}: {{ required "secrets.redisURL is required when secrets.existingSecret is empty" .Values.secrets.redisURL | quote }}
  {{ .Values.secrets.apiAuthConfigKey }}: {{ .Values.secrets.apiAuthConfig | quote }}
  {{ .Values.secrets.agentAuthConfigKey }}: {{ .Values.secrets.agentAuthConfig | quote }}
{{- end }}
