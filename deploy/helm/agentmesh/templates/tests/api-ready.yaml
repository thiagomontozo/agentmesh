apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "agentmesh.fullname" . }}-api-test"
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: readiness
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      command: ["wget", "-q", "-O", "-", "http://{{ include "agentmesh.fullname" . }}-api:{{ .Values.api.service.port }}/readyz"]
