name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cloud-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Lint chart
        run: helm lint deploy/helm/agentmesh --strict

      - name: Render default distributed topology
        run: helm template agentmesh deploy/helm/agentmesh --namespace agentmesh --kube-version 1.30.0 > "$RUNNER_TEMP/agentmesh.yaml"

      - name: Render inline-secret and fixed-replica variants
        run: |
          helm template agentmesh deploy/helm/agentmesh --namespace agentmesh \
            --set secrets.existingSecret= \
            --set secrets.databaseURL=postgres://postgres/agentmesh \
            --set secrets.natsURL=nats://nats:4222 \
            --set secrets.redisURL=redis://redis:6379 \
            --set api.autoscaling.enabled=false \
            --set worker.autoscaling.enabled=false \
            --set dashboard.enabled=false > "$RUNNER_TEMP/agentmesh-variant.yaml"

      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f compose.production.yml config -q

      - name: Validate production preparation script
        run: sh -n scripts/prepare-production-compose.sh

  production-compose:
    runs-on: ubuntu-latest
    env:
      AGENTMESH_IMAGE: agentmesh-production:test
      DASHBOARD_IMAGE: agentmesh-dashboard-production:test
      POSTGRES_IMAGE: postgres:17-alpine
      NATS_IMAGE: nats:2.12-alpine
      REDIS_IMAGE: redis:8.2-alpine
      GATEWAY_IMAGE: nginx:alpine
      IMAGE_PULL_POLICY: missing
      HTTP_BIND_ADDRESS: 127.0.0.1
      HTTPS_BIND_ADDRESS: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare ephemeral production secrets
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.crt" >/dev/null 2>&1
          sh scripts/prepare-production-compose.sh \
            "$RUNNER_TEMP/tls.crt" "$RUNNER_TEMP/tls.key" "$RUNNER_TEMP/agentmesh-secrets"
          echo "SECRETS_DIR=$RUNNER_TEMP/agentmesh-secrets" >> "$GITHUB_ENV"

      - name: Build application images
        run: |
          docker build -t "$AGENTMESH_IMAGE" .
          docker build -t "$DASHBOARD_IMAGE" dashboard

      - name: Start production topology
        run: docker compose --env-file .env.production.example -f compose.production.yml up -d --wait

      - name: Execute authenticated production smoke test
        run: |
          token=$(cat "$SECRETS_DIR/automation_api_token")
          dashboard_password=$(cat "$SECRETS_DIR/dashboard_basic_auth_password")
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://127.0.0.1/)" = 401
          curl --fail --silent --show-error --insecure \
            --user "agentmesh:$dashboard_password" https://127.0.0.1/ >/dev/null
          agent_id=$(curl --fail --silent --show-error --insecure \
            -X POST https://127.0.0.1/api/v1/agents \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"production-compose-ci"}' | jq -r .id)
          test -n "$agent_id" && test "$agent_id" != null
          run_id=$(curl --fail --silent --show-error --insecure \
            -X POST https://127.0.0.1/api/v1/runs \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: production-compose-ci' \
            -d "{\"agent_id\":\"$agent_id\",\"input\":\"production smoke\"}" | jq -r .id)
          for attempt in $(seq 1 60); do
            response=$(curl --fail --silent --show-error --insecure \
              -H "Authorization: Bearer $token" \
              "https://127.0.0.1/api/v1/runs/$run_id")
            status=$(jq -r .status <<<"$response")
            if [ "$status" = succeeded ]; then
              jq -e '.output == "Agent \"production-compose-ci\" processed: production smoke"' <<<"$response"
              exit 0
            fi
            if [ "$status" = failed ] || [ "$status" = canceled ]; then
              jq . <<<"$response"
              exit 1
            fi
            sleep 1
          done
          echo "production Run did not finish" >&2
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.production.example -f compose.production.yml logs --no-color

      - name: Stop production topology
        if: always()
        run: docker compose --env-file .env.production.example -f compose.production.yml down -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck dashboard
        run: npm run typecheck

      - name: Build dashboard
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./cmd/agentmesh

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Start distributed dependencies
        run: docker compose up -d --wait postgres nats redis

      - name: Integration test
        run: go test -tags=integration -count=1 ./internal/integration

      - name: Stop distributed dependencies
        if: always()
        run: docker compose down -v

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build current and compatibility baseline
        run: |
          go build -o "$RUNNER_TEMP/agentmesh-current" ./cmd/agentmesh
          baseline=$(tr -d '[:space:]' < compatibility/baseline.txt)
          git worktree add --detach "$RUNNER_TEMP/agentmesh-baseline-src" "$baseline"
          (cd "$RUNNER_TEMP/agentmesh-baseline-src" && go build -o "$RUNNER_TEMP/agentmesh-baseline" ./cmd/agentmesh)

      - name: Start distributed dependencies
        run: docker compose up -d --wait postgres nats redis

      - name: Mixed-version rolling upgrade
        run: scripts/rolling-upgrade-test.sh "$RUNNER_TEMP/agentmesh-baseline" "$RUNNER_TEMP/agentmesh-current"

      - name: Stop distributed dependencies
        if: always()
        run: docker compose down -v

  resilience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build production binary
        run: go build -o "$RUNNER_TEMP/agentmesh-current" ./cmd/agentmesh

      - name: Start distributed dependencies
        run: docker compose up -d --wait postgres nats redis

      - name: Dependency outage and recovery
        run: scripts/dependency-resilience-test.sh "$RUNNER_TEMP/agentmesh-current"

      - name: Stop distributed dependencies
        if: always()
        run: docker compose down -v
