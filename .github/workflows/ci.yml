name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cloud-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Lint chart
        run: helm lint deploy/helm/agentmesh --strict

      - name: Render default distributed topology
        run: helm template agentmesh deploy/helm/agentmesh --namespace agentmesh --kube-version 1.30.0 > "$RUNNER_TEMP/agentmesh.yaml"

      - name: Render inline-secret and fixed-replica variants
        run: |
          helm template agentmesh deploy/helm/agentmesh --namespace agentmesh \
            --set secrets.existingSecret= \
            --set secrets.databaseURL=postgres://postgres/agentmesh \
            --set secrets.natsURL=nats://nats:4222 \
            --set secrets.redisURL=redis://redis:6379 \
            --set api.autoscaling.enabled=false \
            --set worker.autoscaling.enabled=false \
            --set dashboard.enabled=false > "$RUNNER_TEMP/agentmesh-variant.yaml"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck dashboard
        run: npm run typecheck

      - name: Build dashboard
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./cmd/agentmesh

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Start distributed dependencies
        run: docker compose up -d --wait postgres nats redis

      - name: Integration test
        run: go test -tags=integration -count=1 ./internal/integration

      - name: Stop distributed dependencies
        if: always()
        run: docker compose down -v

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build current and compatibility baseline
        run: |
          go build -o "$RUNNER_TEMP/agentmesh-current" ./cmd/agentmesh
          baseline=$(tr -d '[:space:]' < compatibility/baseline.txt)
          git worktree add --detach "$RUNNER_TEMP/agentmesh-baseline-src" "$baseline"
          (cd "$RUNNER_TEMP/agentmesh-baseline-src" && go build -o "$RUNNER_TEMP/agentmesh-baseline" ./cmd/agentmesh)

      - name: Start distributed dependencies
        run: docker compose up -d --wait postgres nats redis

      - name: Mixed-version rolling upgrade
        run: scripts/rolling-upgrade-test.sh "$RUNNER_TEMP/agentmesh-baseline" "$RUNNER_TEMP/agentmesh-current"

      - name: Stop distributed dependencies
        if: always()
        run: docker compose down -v

  resilience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build production binary
        run: go build -o "$RUNNER_TEMP/agentmesh-current" ./cmd/agentmesh

      - name: Start distributed dependencies
        run: docker compose up -d --wait postgres nats redis

      - name: Dependency outage and recovery
        run: scripts/dependency-resilience-test.sh "$RUNNER_TEMP/agentmesh-current"

      - name: Stop distributed dependencies
        if: always()
        run: docker compose down -v
