services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: agentmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agentmesh:
    build: .
    ports:
      - "8080:8080"
    environment:
      AGENTMESH_ADDR: ":8080"
      AGENTMESH_INSTANCE_ID: "agentmesh-compose"
      AGENTMESH_MODE: "distributed"
      AGENTMESH_ROLE: "all"
      AGENTMESH_WORKERS: "4"
      AGENTMESH_EXECUTION_DELAY: "750ms"
      AGENTMESH_ATTEMPT_TIMEOUT: "30s"
      AGENTMESH_MAX_ATTEMPTS: "3"
      AGENTMESH_RETRY_INITIAL_BACKOFF: "250ms"
      AGENTMESH_RETRY_MAX_BACKOFF: "5s"
      AGENTMESH_LEASE_TTL: "5m"
      AGENTMESH_AGENT_HEALTH_PATH: "/healthz"
      AGENTMESH_AGENT_HEALTH_INTERVAL: "30s"
      AGENTMESH_AGENT_HEALTH_TIMEOUT: "2s"
      AGENTMESH_AGENT_HEALTH_WORKERS: "2"
      AGENTMESH_HTTP_ALLOW_PRIVATE_NETWORKS: "true"
      AGENTMESH_HTTP_ALLOW_LOOPBACK: "true"
      AGENTMESH_HTTP_ALLOW_LINK_LOCAL: "false"
      AGENTMESH_DATABASE_URL: "postgres://agentmesh:agentmesh@postgres:5432/agentmesh?sslmode=disable"
      AGENTMESH_NATS_URL: "nats://nats:4222"
      AGENTMESH_REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  nats-data:
  redis-data:
